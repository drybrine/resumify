name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values: the build only needs the variables to exist.
          # Nothing here is a real secret and no network call uses them.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key-for-build-only
          QRIS_STATIC_PAYLOAD: 0002010102112600000000000000000000000000000000
          NEXT_PUBLIC_APP_URL: https://example.com

      - name: Audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
